name: "🐛 Bug 反馈 / Bug report"
description: "报告一个问题，帮助 Islet 变得更好 / Report a problem to help improve Islet"
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！请尽量填写以下信息。/ Thanks for reporting! Please fill in the details below.

  - type: textarea
    id: description
    attributes:
      label: "问题描述 / Description"
      description: "清晰描述遇到的问题。/ A clear description of the bug."
      placeholder: "例如：打开设置面板时……/ e.g. When opening the settings panel..."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: "复现步骤 / Steps to reproduce"
      description: "如何一步步触发这个问题。/ How to reproduce, step by step."
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: "期望行为 / Expected behavior"
      description: "你认为正确的表现应该是怎样。/ What you expected to happen."
    validations:
      required: false

  - type: textarea
    id: screenshots
    attributes:
      label: "截图 / Screenshots"
      description: "如有相关截图或录屏，请粘贴。/ Paste screenshots or recordings if any."
    validations:
      required: false

  - type: dropdown
    id: browser
    attributes:
      label: "浏览器 / Browser"
      options:
        - Chrome
        - Edge
        - Firefox
        - "其他 / Other"
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: "扩展版本 / Extension version"
      description: "见扩展管理页或设置面板「关于」。/ See the extensions page or the About tab."
      placeholder: "例如 / e.g. 1.7.2"
    validations:
      required: false

  - type: input
    id: os
    attributes:
      label: "操作系统 / OS"
      placeholder: "例如 / e.g. Windows 11 / macOS 14 / Ubuntu 24.04"
    validations:
      required: false
