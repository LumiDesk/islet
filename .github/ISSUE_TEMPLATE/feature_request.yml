name: "✨ 功能建议 / Feature request"
description: "提出一个新功能或改进想法 / Suggest a new feature or improvement"
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢建议！请注意 Islet 坚持**零联网权限 / 隐私至上**，需要跨域接口的功能可能无法采纳。
        Thanks! Note that Islet is committed to **zero network permissions / privacy first**; features requiring cross-origin requests may not be accepted.

  - type: textarea
    id: problem
    attributes:
      label: "想解决的问题 / The problem"
      description: "这个建议想解决什么痛点？/ What problem would this feature solve?"
      placeholder: "例如：我希望能在搜索栏下方……/ e.g. I wish I could ... below the search bar"
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: "方案设想 / Proposed solution"
      description: "你期望它如何工作。/ How you'd like it to work."
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: "备选方案 / Alternatives"
      description: "考虑过的其他做法。/ Other approaches you've considered."
    validations:
      required: false

  - type: checkboxes
    id: privacy
    attributes:
      label: "隐私原则 / Privacy principle"
      options:
        - label: "该功能无需任何联网权限或额外权限（或我已在上文说明为何必要）。/ This feature needs no network or extra permissions (or I explained above why it's necessary)."
          required: false

  - type: textarea
    id: extra
    attributes:
      label: "补充信息 / Additional context"
      description: "参考图、示例、相关链接等。/ Mockups, examples, references, etc."
    validations:
      required: false
