<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Islet</title>
    <!-- 在首屏绘制前同步套用主题，避免刷新时由浅色闪烁到深色（FOUC）。
         必须用外部脚本而非内联脚本：MV3 扩展 CSP（script-src 'self'）会拦截内联脚本，
         导致打包成扩展后首屏防闪失效。放在 <head> 的同步 <script src> 会阻塞渲染、
         在首屏绘制前执行，效果与原内联一致。 -->
    <script src="./theme-init.js"></script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
